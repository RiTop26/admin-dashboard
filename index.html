<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css" >
</head>
<body>
    <div class="container" >
        <div class="header" >
            <div class="first-part">
                <form action="" method="get">
                    <div class="search-bar" >
                        <img src="./icons/magnify.svg" height="50" width="50"/>
                        <label for="sch-bar"></label>
                        <input type="search" id="sch-bar" name="search" />
                    </div>
                </form>

                <div class="user-profil">
                    <img src="./icons/bell-ring-outline.svg" height="50" width="50" />
                    <img src="./icons/reddit.svg" height="50" width="50" />
                    <p>Morgan Oakley</p>
                </div>
            </div>
            
            <div class="second-part">
                <div class="info">
                    <img src="./icons/reddit.svg" height="50" width="50" />
                    <p>Hi there,</p>
                    <p>Morgan Oakley (@morgan)</p>
                </div>

                <div class="buttons">
                    <button type="submit">New</button>
                    <button type="submit">Upload</button>
                    <button type="submit">Share</button>
                </div>
            </div>
        </div>

        <div class="sidebar" >
        
        </div>

        <div class="main-content" >
            
        </div>
    </div>
</body>
</html>
